<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tamagochibot — Telegram Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --vip: #f59e0b;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0; padding: 16px;
      background: var(--tg-theme-bg-color, var(--bg));
      color: var(--tg-theme-text-color, var(--text));
    }
    .box {
      max-width: 440px; margin: 0 auto;
      background: var(--tg-theme-secondary-bg-color, var(--card));
      border-radius: 18px; padding: 18px;
    }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .tag {
      font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px;
      background: rgba(245, 158, 11, 0.18); color: var(--vip); border: 1px solid var(--vip);
    }
    .stage {
      background: #0b1120; border: 2px solid #334155; border-radius: 16px;
      padding: 22px 12px; text-align: center; margin-bottom: 16px;
    }
    .pet {
      font-size: 40px; font-weight: 800; display: inline-block;
      animation: bounce 2s ease-in-out infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .sub { color: var(--muted); font-size: 13px; margin-top: 8px; }
    .bar-wrap { margin-bottom: 11px; }
    .bar-top { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
    .bar-bg { height: 9px; background: #334155; border-radius: 999px; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--accent); transition: width 0.25s; }
    .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
    button {
      border: 0; border-radius: 12px; padding: 11px 8px; font-weight: 700;
      font-size: 13px; cursor: pointer; background: #334155; color: #fff;
    }
    .vip-card {
      margin-top: 16px; padding-top: 14px; border-top: 1px solid #334155;
    }
    .vip-btn {
      width: 100%; margin-top: 8px;
      background: linear-gradient(90deg, #d97706, #f59e0b); color: #0f172a;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="header">
      <strong>🐾 tamagochibot</strong>
      <span id="vipStatus" class="tag">VIP 24h • 15 ⭐</span>
    </div>

    <div class="stage">
      <div id="petFace" class="pet">★( ^o^ )★</div>
      <div id="petMsg" class="sub">Listo para jugar y ganar Estrellas</div>
    </div>

    <div class="bar-wrap">
      <div class="bar-top"><span>🍖 Hambre</span><span id="hambreTxt">70%</span></div>
      <div class="bar-bg"><div id="hambreBar" class="bar-fill" style="width:70%"></div></div>
    </div>

    <div class="bar-wrap">
      <div class="bar-top"><span>🎾 Felicidad</span><span id="felicidadTxt">75%</span></div>
      <div class="bar-bg"><div id="felicidadBar" class="bar-fill" style="width:75%"></div></div>
    </div>

    <div class="bar-wrap">
      <div class="bar-top"><span>⚡ Energía</span><span id="energiaTxt">80%</span></div>
      <div class="bar-bg"><div id="energiaBar" class="bar-fill" style="width:80%"></div></div>
    </div>

    <div class="actions">
      <button onclick="cuidar('alimentar', 20, 5, 0, '🍖 ¡Alimentado!')">🍖 Comer</button>
      <button onclick="cuidar('jugar', -5, 25, -10, '🎾 ¡Jugando!')">🎾 Jugar</button>
      <button onclick="cuidar('dormir', 0, 0, 30, '💤 ¡Durmiendo!')">💤 Dormir</button>
    </div>

    <div class="vip-card">
      <strong>⭐ Mejoras VIP con Telegram Stars</strong>
      <button class="vip-btn" onclick="pedirFactura('/buy_vip')">👑 Pase VIP 24h (15 ⭐)</button>
      <button class="vip-btn" onclick="pedirFactura('/buy_banquete')">🍖 Banquete Real 100% (10 ⭐)</button>
      <button class="vip-btn" onclick="pedirFactura('/buy_energia')">⚡ Súper Batería 100% (10 ⭐)</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    let state = { hambre: 70, felicidad: 75, energia: 80 };

    function clamp(v) { return Math.max(0, Math.min(100, v)); }

    function render(msg) {
      state.hambre = clamp(state.hambre);
      state.felicidad = clamp(state.felicidad);
      state.energia = clamp(state.energia);

      document.getElementById('hambreTxt').textContent = state.hambre + '%';
      document.getElementById('hambreBar').style.width = state.hambre + '%';
      document.getElementById('felicidadTxt').textContent = state.felicidad + '%';
      document.getElementById('felicidadBar').style.width = state.felicidad + '%';
      document.getElementById('energiaTxt').textContent = state.energia + '%';
      document.getElementById('energiaBar').style.width = state.energia + '%';

      const face = document.getElementById('petFace');
      if (state.hambre < 25 || state.energia < 20) face.textContent = '(×_×)';
      else if (state.felicidad < 35) face.textContent = '(•︵•)';
      else face.textContent = '★( ^o^ )★';

      if (msg) document.getElementById('petMsg').textContent = msg;
    }

    function cuidar(accion, dh, df, de, msg) {
      state.hambre += dh;
      state.felicidad += df;
      state.energia += de;
      render(msg);

      // Si se abrió desde un teclado con web_app, envía la acción al bot
      try {
        tg.sendData(JSON.stringify({ action: accion }));
      } catch (e) {}
    }

    function pedirFactura(comandoCompra) {
      // Abre el bot con el comando de compra o cierra el Mini App enviando el comando
      try {
        tg.sendData(JSON.stringify({ command: comandoCompra }));
      } catch (e) {}
      tg.openTelegramLink('https://t.me/tamagochibot?text=' + encodeURIComponent(comandoCompra));
    }

    render();
  </script>
</body>
</html>
